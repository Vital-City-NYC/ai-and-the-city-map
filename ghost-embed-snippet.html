<!-- AI and the City: idea map. Vital City embed. Paste into a Ghost HTML card. -->
<div class="vc-embed-ai-and-the-city-map" style="margin:1.5em 0;">
  <div class="vc-embed-ai-and-the-city-map__frame" style="position:relative;width:100%;border:1px solid #111;overflow:hidden;">
    <iframe
      class="vc-embed-ai-and-the-city-map__iframe"
      src="https://vital-city-nyc.github.io/ai-and-the-city-map/?embed=1"
      title="AI and the City: a subway map of the issue's ideas"
      loading="lazy"
      scrolling="no"
      style="display:block;width:100%;height:1500px;border:0;background:#fff;"
    ></iframe>
  </div>
  <p style="font-size:0.8em;color:#666;margin:0.5em 0 0;text-align:center;">
    Pick a line or a stop to explore.
    <a href="https://vital-city-nyc.github.io/ai-and-the-city-map/" target="_blank" rel="noopener">Open full screen ↗</a>
  </p>
  <script>
    (function () {
      var f = document.querySelector('.vc-embed-ai-and-the-city-map__iframe');
      window.addEventListener('message', function (e) {
        var d = e && e.data;
        if (!f || e.source !== f.contentWindow || !d || d.id !== 'ai-and-the-city-map') return;
        if (d.type === 'vc-embed-height' && typeof d.height === 'number') {
          f.style.height = d.height + 'px';
        } else if (d.type === 'vc-embed-scroll' && typeof d.top === 'number') {
          // The map opened a detail panel; bring it into view if it isn't.
          var top = f.getBoundingClientRect().top + d.top;
          var bottom = top + Math.min(d.height || 0, window.innerHeight);
          if (top < 0 || bottom > window.innerHeight) {
            window.scrollTo({ top: window.scrollY + top - 24, behavior: 'smooth' });
          }
        }
      });
    })();
  </script>
</div>
