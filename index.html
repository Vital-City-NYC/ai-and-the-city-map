<style>
@font-face{font-family:"GascogneTS";src:url("https://vital-city-nyc.github.io/vital-city-design-system/fonts/GascogneTS-Light.ttf") format("truetype");font-weight:300;font-style:normal;font-display:swap}
:root{
  --vc-black:#050507;--vc-white:#fff;--vc-cloud:#ddd;--vc-paper:#f7f7f4;--vc-charcoal:#707175;
  --vc-orange:#ff7c53;--vc-magenta:#e7466d;--vc-cerulean:#217ebe;--vc-chartreuse:#dde44c;
  --sans:"halyard-text","Inter","Helvetica Neue",Arial,sans-serif;
  --serif:"GascogneTS","Source Serif 4",Georgia,serif;
  --map:#050507;--map-ink:#fff;--map-muted:#8d8d90;--district:#111114;--district-label:#2c2c33;
  --panel-w:440px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--vc-white);color:var(--vc-black);font-family:var(--sans);font-weight:300;line-height:1.5}
button{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:margin-right .25s ease}
@media (min-width:1180px){body.panel-open .wrap{margin-right:calc(var(--panel-w) + 8px)}}

/* ---------- Header ---------- */
.top{padding:32px 0 18px}
h1{font-family:var(--sans);font-weight:900;font-size:clamp(2rem,3.4vw,2.75rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
.dek{font-size:clamp(1.05rem,1.4vw,1.25rem);margin:0 0 14px;max-width:46em}
.howto{font-size:.95rem;color:#333;margin:0;max-width:52em}
.howto b{font-weight:700}

/* ---------- Line chooser ---------- */
.lines{display:flex;flex-wrap:wrap;gap:8px 10px;margin:18px 0 14px;padding:0;list-style:none}
.linebtn{display:flex;align-items:center;gap:8px;background:var(--vc-white);border:2px solid var(--vc-black);padding:6px 12px 6px 6px;cursor:pointer;font-weight:700;font-size:.92rem;line-height:1.15;text-align:left}
.linebtn:hover,.linebtn:focus-visible{background:var(--vc-black);color:var(--vc-white);outline:none}
.linebtn[aria-pressed="true"]{background:var(--vc-black);color:var(--vc-white)}
.bullet{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:900;font-size:.85rem;color:var(--vc-black);line-height:1}
.bullet.sm{width:19px;height:19px;font-size:.66rem}
.bullet.planned{border:2px dashed var(--vc-black)}
.linebtn:hover .bullet.planned,.linebtn[aria-pressed="true"] .bullet.planned{border-color:var(--vc-white)}
.linebtn .q{display:block;font-weight:300;font-size:.8rem;opacity:.85}
@media (max-width:760px){.lines{display:grid;grid-template-columns:1fr 1fr;gap:6px}.linebtn{width:100%;padding:5px 8px 5px 5px;font-size:.88rem}.linebtn .q{display:none}}

/* ---------- Map ---------- */
.mapcard{background:var(--map);position:relative}
.mapscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#map{display:block;width:100%;height:auto;min-width:960px;user-select:none}
.maphint{display:none;color:var(--map-muted);font-size:.8rem;padding:8px 12px 0}
@media (max-width:760px){.maphint{display:block}}
.district-label{font-family:var(--sans);font-weight:900;fill:#3a3a42;font-size:20px}
.line path.ink{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
.line path.hit{fill:none;stroke:transparent;stroke-width:20;cursor:pointer}
.station{cursor:pointer;transition:opacity .2s}
.station:focus{outline:none}
.station:focus-visible .halo,.station:hover .halo{stroke:var(--vc-chartreuse);stroke-opacity:1}
.station .halo{fill:none;stroke-width:3;stroke-opacity:0}
.station text{font-family:var(--sans);fill:var(--map-ink);paint-order:stroke;stroke:var(--map);stroke-width:5px;stroke-linejoin:round}
.station .nm{font-weight:700;font-size:15px}
.station .sh{font-weight:300;font-size:13px;fill:#c8c8cc}
.station.pending .nm{fill:#9a9aa0;font-weight:700}
.station.pending .sh{fill:#6f6f76}
#map.focus .line:not(.on){opacity:.13}
#map.focus .station:not(.on){opacity:.28}
#map.focus .line.on path.ink{filter:none}
.legend-key{font-family:var(--sans);font-size:13px;fill:var(--map-muted)}

/* ---------- Table of contents ---------- */
.toc{padding:34px 0 10px}
.toc h2{font-weight:900;font-size:1.5rem;margin:0 0 4px}
.toc .sub{margin:0 0 18px;color:#333;font-size:.95rem}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:26px 28px}
.sec h3{font-weight:900;font-size:1.1rem;margin:0 0 8px;padding-top:8px;border-top:2px solid var(--vc-black)}
.sec ol{list-style:none;margin:0;padding:0}
.sec li{margin:0}
.tocbtn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;background:none;border:0;border-bottom:1px solid var(--vc-cloud);padding:9px 0;text-align:left;cursor:pointer}
.tocbtn:hover .t,.tocbtn:focus-visible .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tocbtn:focus-visible{outline:2px solid var(--vc-black);outline-offset:2px}
.tocbtn .t{font-weight:700;font-size:.98rem;line-height:1.25}
.tocbtn .a{grid-column:1;font-size:.88rem;color:#444}
.tocbtn .bl{grid-row:1 / span 2;grid-column:2;display:flex;gap:3px;align-items:flex-start;padding-top:2px}
.tocbtn.pending .t{color:var(--vc-charcoal)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid currentColor;padding:0 5px;margin-left:6px;vertical-align:2px;color:var(--vc-charcoal)}
.foot{font-size:.82rem;color:var(--vc-charcoal);padding:22px 0 40px;max-width:60em}

/* ---------- Panel ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(var(--panel-w),100vw);background:var(--vc-white);border-left:2px solid var(--vc-black);transform:translateX(102%);transition:transform .25s ease;z-index:40;display:flex;flex-direction:column}
body.panel-open .panel{transform:none}
.panel-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px 16px;border-bottom:1px solid var(--vc-cloud);flex:none}
.panel-bar .crumb{font-size:.82rem;color:var(--vc-charcoal);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.closebtn{background:none;border:2px solid var(--vc-black);font-weight:700;font-size:.85rem;padding:3px 10px;cursor:pointer}
.closebtn:hover,.closebtn:focus-visible{background:var(--vc-black);color:var(--vc-white);outline:none}
.panel-body{overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) 18px;flex:1;-webkit-overflow-scrolling:touch}
@media (max-width:760px){
  .panel{top:auto;left:0;width:100%;height:80vh;border-left:0;border-top:2px solid var(--vc-black);transform:translateY(102%)}
}
.p-sec{font-size:.82rem;color:var(--vc-charcoal);font-weight:700;margin:0 0 6px}
.p-title{font-weight:900;font-size:1.55rem;line-height:1.12;margin:0 0 10px}
.p-by{font-size:1.05rem;margin:0 0 4px}
.p-by b{font-weight:700}
.p-bio{font-size:.84rem;color:#444;margin:0 0 14px}
.p-thesis{font-size:1rem;margin:0 0 14px}
.p-quote{font-family:var(--serif);font-weight:300;font-size:1.32rem;line-height:1.3;margin:0 0 16px;padding:12px 0 12px 14px;border-left:6px solid var(--accent,var(--vc-orange))}
.p-quote cite{display:block;font-family:var(--sans);font-style:normal;font-size:.8rem;color:var(--vc-charcoal);margin-top:6px}
.cta{display:inline-block;background:var(--vc-black);color:var(--vc-white);text-decoration:none;font-weight:700;padding:10px 16px;margin:2px 0 18px;border:2px solid var(--vc-black)}
.cta:hover,.cta:focus-visible{background:var(--vc-orange);color:var(--vc-black);outline:none}
.cta.off{background:var(--vc-white);color:var(--vc-charcoal);border-color:var(--vc-cloud);cursor:default}
.p-h{font-weight:900;font-size:1rem;margin:20px 0 8px}
.rides{list-style:none;margin:0;padding:0}
.rides li{margin:0 0 10px}
.ridebtn{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.ridebtn .ln{font-weight:700;font-size:.92rem}
.ridebtn .tk{grid-column:2;font-size:.92rem;color:#222}
.ridebtn:hover .ln,.ridebtn:focus-visible .ln{text-decoration:underline;text-underline-offset:3px}
.ridebtn:focus-visible{outline:2px solid var(--vc-black);outline-offset:3px}
.xfers{list-style:none;margin:0;padding:0}
.xfers li{margin:0 0 10px}
.xbtn{display:block;width:100%;background:var(--vc-paper);border:0;border-left:4px solid var(--vc-black);padding:8px 10px;text-align:left;cursor:pointer}
.xbtn:hover,.xbtn:focus-visible{background:#ececE6;outline:none}
.xbtn .k{display:block;font-size:.76rem;font-weight:700;color:var(--vc-charcoal)}
.xbtn .who{display:block;font-weight:700;font-size:.95rem}
.xbtn .why{display:block;font-size:.88rem;color:#333}
.pend{background:var(--vc-paper);padding:12px;font-size:.92rem;margin:0 0 16px}

/* line view: strip map */
.l-head{display:flex;gap:12px;align-items:center;margin:0 0 8px}
.l-head .bullet{width:44px;height:44px;font-size:1.35rem}
.l-name{font-weight:900;font-size:1.45rem;line-height:1.1;margin:0}
.l-q{font-size:1.08rem;font-weight:700;margin:0 0 10px}
.l-sum{font-size:.98rem;margin:0 0 16px}
.strip{list-style:none;margin:0;padding:0;position:relative}
.strip li{position:relative;padding:0 0 16px 34px}
.strip li::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:8px;background:var(--lc)}
.strip li:first-child::before{top:10px}
.strip li:last-child::before{bottom:auto;height:12px}
.strip .dot{position:absolute;left:4px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--vc-black)}
.stopbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%}
.stopbtn .who{display:block;font-weight:700;font-size:.98rem}
.stopbtn .ttl{display:block;font-size:.84rem;color:var(--vc-charcoal)}
.stopbtn .tk{display:block;font-size:.93rem;margin-top:2px}
.stopbtn:hover .who,.stopbtn:focus-visible .who{text-decoration:underline;text-underline-offset:3px}
.stopbtn:focus-visible{outline:2px solid var(--vc-black);outline-offset:3px}
.xbul{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}

body.embed .top{padding-top:8px}
body.embed .top h1,body.embed .top .dek{display:none}

body.embed.panel-open .wrap{margin-right:auto}
body.embed .panel{position:absolute;bottom:auto;height:620px;transform:none;transition:none;visibility:hidden;border:2px solid var(--vc-black);box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:760px){body.embed .panel{left:0;right:0;width:auto;height:560px;border:2px solid var(--vc-black)}}

<script>
/* =====================================================================
   THE ISSUE. Everything on the page is drawn from this block.

   To add a piece: add an entry to `pieces` (give it a free grid spot in
   `at`), then add it to the `stops` of each line it rides, with a one-line
   `take`. To drop a piece: delete its entry and its stops. When a piece
   publishes, paste its URL into `url` and set status to "published".
   ===================================================================== */
const ISSUE = {
  title: "AI and the City",
  dek: "What happens when 21st-century code meets cracking concrete and big bureaucracy.",
  howto: "Each colored line is an argument that runs through the issue, and each stop is a piece. <b>Pick a line</b> to ride it and see where every author lands, or <b>pick a stop</b> for the piece’s case and its transfers. {live} of {pieces} pieces are on the map so far; the rest are stations under construction. New to the issue? <a href=\"#piece-editors\">Start with the editors’ note</a>.",
  tocNote: "Working order from the issue plan. Pieces marked “in the works” don’t have a draft yet.",
  footnote: "A first cut, built from drafts as of Nov. 9, 2026. Summaries paraphrase the drafts; quotations come from them and may change in editing. Each “Read the piece” button goes live when its piece publishes.",

  sections: [
    { id: "reboot",  name: "The Big Reboot",                  area: [0, 0, 8, 16],        labelAt: [0.3, 15.65] },
    { id: "retrain", name: "Retraining Our Systems",          area: [8, 0, 9.25, 6],      labelAt: [8.3, 2.5] },
    { id: "wider",   name: "The Wider City",                  area: [17.25, 0, 11.5, 6], labelAt: [17.45, 0.75] },
    { id: "prompts", name: "Better Prompts, Better Services", area: [8, 6, 20.75, 10],     labelAt: [28.45, 15.65, "end"] }
  ],

  lines: [
    { id: "t", letter: "T", name: "Time tax", color: "#ff7c53",
      question: "Can AI give back the hours government takes?",
      summary: "Almost every author starts here: the hours New Yorkers and city workers lose to forms, hold music and approvals. The split is over where the fix lives. Samuels and Aggarwala would put AI to work in the background now. Chu and Rouault warn that speeding up a step that isn’t the bottleneck changes nothing. Tang wants every request to get a case number, and Gupta asks what to do with the time AI saves.",
      via: { "chu>tang": [[8.5, 4.5], [10.5, 6.5], [15.5, 6.5]], "aggarwala>gupta": [[21.5, 7.5]] },
      stops: [
        { p: "samuels", take: "Go after the time tax: AI working in the background so a mother doesn’t lose an afternoon recertifying a benefit." },
        { p: "chu", take: "Speed up a step that isn’t the bottleneck and nothing changes. Boston rebuilt permitting around what residents are trying to do." },
        { p: "tang", take: "311 had no category for her ID card question, so no case number. Every request should get one, routed to whoever owns the problem." },
        { p: "aggarwala", take: "The hidden time tax is inside government: forms bounced between offices. Let AI check them before they’re submitted." },
        { p: "gupta", take: "Take AI’s productivity gains as free time: three more Monday holidays and guaranteed paid vacation." }
      ] },

    { id: "w", letter: "W", name: "Workforce", color: "#e7466d",
      question: "What happens to the people who do the city’s work?",
      summary: "The sharpest argument in the issue. Goldsmith would trade guarantees for change: no layoffs, training and a share of the savings, with the payroll shrinking through attrition. Heywood says Albany’s LOADinG Act protects tasks instead of people. Chu and Rouault, Tang, Aggarwala, Samuels and Schaeffer land on the same rule: augment the workers, don’t replace them.",
      via: { "aggarwala>schaeffer": [[21.5, 7.5]] },
      stops: [
        { p: "samuels", take: "Nonprofits don’t ask how to replace staff. They want staff freed from the administrative work that buries them." },
        { p: "chu", take: "Augment and redirect workers, don’t replace them. About 38% of local government employees are expected to retire within five years." },
        { p: "goldsmith", take: "Strike a bargain: no AI layoffs, training and a share of the gains in paychecks, then shrink the payroll through attrition." },
        { p: "heywood", take: "Albany’s LOADinG Act protects duties, not workers, and may bar AI from any task an employee does now." },
        { p: "tang", take: "Give DC37 a seat at the table. The goal is to put residents in front of city workers, not to cut them." },
        { p: "aggarwala", take: "No one loses a job to a form-checker; the exceptions still need a civil servant’s judgment." },
        { p: "schaeffer", take: "AI can cover nights and weekends, but it supplements caseworkers and is no excuse to cut their funding." }
      ] },

    { id: "r", letter: "R", name: "Rules", color: "#4e98cb",
      question: "Who should write AI’s rules: Washington, Albany or City Hall?",
      summary: "Frazier draws the boundary: frontier AI is Washington’s job, and cities should govern what residents can see. Washburn argues that the best model for governing AI is a New York invention, zoning. Meanwhile, the rules that actually bind the city come from Albany and from its own agencies: the LOADinG Act, state camera law and the Education Department’s new classroom policy.",
      via: { "frazier>heywood": [[13.5, 1.5]] },
      stops: [
        { p: "washburn", take: "The industry asked for a building code for each model. It needs zoning for the swarm of agents, as New York learned in 1916." },
        { p: "frazier", take: "Frontier AI is Washington’s job. Cities should stick to what only they can do, starting with uses residents can see." },
        { p: "heywood", take: "The strictest rule on the city’s own AI use was written in Albany, and it expires in July 2028 unless renewed." },
        { p: "miller", take: "State law already lets cameras enforce four curb rules. The city should back Albany bills that add loading zones." },
        { p: "reich", take: "The city’s school AI rules follow politics, not science, but they promise a year of real experimentation." }
      ] },

    { id: "p", letter: "P", name: "Privacy", color: "#9b9fbc",
      question: "What should the city’s cameras and sensors be allowed to see?",
      summary: "Nearly every piece that points AI at the street draws the same line. Ratti would write it into law: data about places flows freely, data about people only under strict limits. Miller and Ramaswami want video processed on the device and identities stripped before anything is stored. Chohlas-Wood would point AI at police body-camera footage. Appel argues the city needs no new surveillance at all.",
      via: { "ramaswami>chohlaswood": [[4.25, 8], [7.625, 8], [10.125, 10.5]] },
      stops: [
        { p: "ramaswami", take: "Strip faces and plates before data reaches a server, post signs wherever sensors run and keep facial recognition out of public space." },
        { p: "chohlaswood", take: "AI could review the NYPD’s vast body-camera archive, but first the city has to come clean about the surveillance tools it already buys." },
        { p: "miller", take: "Street sensors should classify on the device, discard the video and send only counts." },
        { p: "ramosruiz", take: "Residents should control where their comments go; what they say shouldn’t follow them." },
        { p: "appel", take: "The city doesn’t need new surveillance tools. What it needs is already in its records." },
        { p: "aggarwala", take: "City contracts should bar AI vendors from training on city data." },
        { p: "ratti", take: "Write one distinction into law: data about places flows freely, data about people only under strict limits." }
      ] },

    { id: "d", letter: "D", name: "Data", color: "#dde44c",
      question: "Is the city’s data good enough to build on?",
      summary: "Ramaswami and Appel see answers waiting in records the city already keeps. Kontokosta is the skeptic: 311 data records who complains, not who needs help, so AI trained on it sends services to the already well served. Chu and Rouault and Oren show how much cleanup and checking it takes to get the data right, and the data story shows what agencies already build on it.",
      via: { "kontokosta>chu": [[6.5, 3]], "ramaswami>datastory": [[4.25, 8]], "datastory>oren": [[8.25, 12]], "oren>appel": [[19, 12]] },
      stops: [
        { p: "kontokosta", take: "311 shows who complains, not who needs help. Train AI on it and services flow to the already well served." },
        { p: "chu", take: "Boston used AI to reconcile 13,000 sidewalk repair cases with mismatched data. Deciding which to fix stayed human." },
        { p: "ramaswami", take: "Fragmented data keeps cities blind to their own complexity. Ground AI in open, verified public data." },
        { p: "datastory", take: "Agencies already build on city records: the Fire Department scores about 330,000 buildings for fire risk using past fires, 311 complaints and nearby crimes." },
        { p: "oren", take: "Each court decision is analyzed 10 times and marked unresolved unless at least eight runs agree." },
        { p: "appel", take: "The answers are in records the city already keeps. AI can clean up Open Data and rank buildings for inspection." }
      ] },

    { id: "m", letter: "M", name: "Measure", color: "#57aa4a",
      question: "How will the city know what works?",
      summary: "Several authors see AI less as a way to do the work than as a way to find out whether the work is working. Harvey would run program evaluations behind agency firewalls. Miller would judge Vision Zero by near-misses instead of tickets, Chohlas-Wood would use AI to count the police stops that go unreported, and Reich wants the schools’ AI year treated as an experiment. Della Volpe asks whether the progress the city reports is progress people feel.",
      via: { "harvey>miller": [[15, 9]] },
      stops: [
        { p: "harvey", take: "Mayors need to know what programs cause. AI behind agency firewalls can run evaluations that took outside researchers years." },
        { p: "miller", take: "Judge Vision Zero by near-misses and street behavior, not tickets. The city’s own plan admits it can’t measure that yet." },
        { p: "chohlaswood", take: "One unreported stop in a sample of 200 clips drove the monitor’s estimate of nearly 2,000. AI-targeted review would make that count far more precise." },
        { p: "reich", take: "Treat the school year as an experiment, and publish the measures, the data and the plan for revising the rules." },
        { p: "dellavolpe", take: "Cities count jobs and on-time rates; residents judge daily life. Trust is won or lost in the gap." },
        { p: "schaeffer", take: "An AI phone coach raised job placements 15%; a parole-hearing tool waits until its side effects are tested." }
      ] },

    { id: "o", letter: "O", name: "Open books", color: "#b9b9ba",
      question: "Can AI turn public records into public knowledge?",
      summary: "Public records aren’t public knowledge until someone can read them. Oren and Chu and Rouault show AI turning court rulings and council votes into plain language. Frazier and Ramaswami turn the demand on the city itself: say when and where it uses AI and sensors, and publish what it finds. The data story reads the list of algorithms the city already discloses.",
      via: { "ramaswami>datastory": [[4.25, 8]], "datastory>oren": [[8.25, 12]] },
      stops: [
        { p: "frazier", take: "When the city uses AI, publish the tool, the task and the outcome measures, then let residents contest them." },
        { p: "chu", take: "Boston turned 19 years of council votes into 20-word plain-language summaries." },
        { p: "ramaswami", take: "People deserve to know what a sensor on their block is doing. Post signs and publish the data as a public asset." },
        { p: "datastory", take: "The city publishes which algorithms its agencies use: 86 tools at 19 agencies in 2025, up from 31 in 2022." },
        { p: "oren", take: "AI turned every Court of Appeals decision since Judge Jenny Rivera joined the bench into plain language anyone can compare." }
      ] },

    { id: "v", letter: "V", name: "Voice", color: "#cea9be",
      question: "Can AI help the city listen, and help neighbors hear each other?",
      summary: "Della Volpe’s AI interviewers and Tang’s listening tools both promise more than a two-minute slot at a hearing, if the city closes the loop. Ramos-Ruiz wants neighbors connected to each other, not just to City Hall. Kontokosta reminds everyone that the loudest complaints are not the greatest needs.",
      stops: [
        { p: "kontokosta", take: "Complaint data is a skewed voice: a household without heat probably won’t call about a pothole." },
        { p: "tang", take: "Use engagement to listen at scale, as Taiwan and California did, and keep each thread open until the problem is solved." },
        { p: "ramosruiz", take: "Civic tech links residents to City Hall but not to each other. AI can point neighbors toward shared concerns." },
        { p: "dellavolpe", take: "AI interviewers have held more than 3,200 conversations with New Yorkers since May. People say more when they can finish their thoughts." }
      ] },

    { id: "g", letter: "G", name: "Gains", color: "#ffffff", planned: true,
      question: "Who gets the gains from the boom?",
      summary: "The issue’s economics line, still drawn dashed because its two pieces on jobs have no drafts yet. Gupta sets the terms: if AI’s gains aren’t widely felt, voters will halt it. Giles wants AI companies to pay into a fund for New Yorkers, and O’Flaherty and Sethi bet on cities that sell trust.",
      via: { "giles>dellavolpe": [[15.5, 14.5]] },
      stops: [
        { p: "sethi", take: "AI makes fakes cheap, so some cities will build their economies around trust: finance, insurance, law, research." },
        { p: "giles", take: "Make AI companies pay into an AI Fund for housing, kids and displaced workers." },
        { p: "dellavolpe", take: "Over the summer, the job worries residents described shifted to AI taking office jobs." },
        { p: "schaeffer", take: "For people leaving prison, an AI phone coach raised job placements 15%." },
        { p: "gupta", take: "If AI’s gains aren’t widely felt, voters will halt it. Pay them out in time." },
        { p: "townsend", take: "Draft in the works." },
        { p: "levine", take: "Draft in the works." }
      ] }
  ],

  pieces: [
    /* ---------------- The Big Reboot ---------------- */
    { id: "editors", section: "reboot", order: 1, offMap: true,
      title: "Editors’ Note", short: "Start here", authors: ["Josh Greenman"],
      thesis: "Most talk about AI swings between doom and hype. As an urban policy journal, Vital City asks a narrower set of questions: what AI can do for cities, what it will unlock and what risks it brings. About half the issue takes up how AI can make city government work better while avoiding mistakes like the MyCity chatbot; the rest steps back to ask how AI might reshape cities themselves.",
      quote: "What can these new technologies do for cities? What capabilities will they unlock? And, just as important, what risks will they pose?",
      status: "draft", url: "",
      links: [
        { to: "frazier",   kind: "Debate it flags", why: "Frazier says Washington should regulate AI, not City Hall or Albany." },
        { to: "giles",     kind: "Debate it flags", why: "Giles answers that the job falls to cities because Washington won’t do it." },
        { to: "goldsmith", kind: "Debate it flags", why: "Goldsmith would shrink the city workforce through attrition as AI takes on more work." },
        { to: "heywood",   kind: "Debate it flags", why: "Heywood warns that a state law already on the books may forbid much of that." }
      ] },
    { id: "chu", section: "reboot", order: 2, at: [5, 4.5], label: "se",
      title: "Between Hype and Reality: What AI Can and Can’t Fix in City Hall",
      short: "Hype vs. reality", authors: ["Tiffany Chu", "Alicia Rouault"],
      bio: "Tiffany Chu is the former chief of staff to Boston Mayor Michelle Wu. Alicia Rouault is director of applied AI for government at Propel and former chief technology officer of the U.S. Department of Health and Human Services.",
      thesis: "Cities are already using AI to clear backlogs, translate council votes and remap permitting, but speeding up a step that wasn’t the bottleneck fixes nothing. Chu and Rouault offer four principles: start from residents’ needs, augment workers, set guardrails instead of bans and build trust through transparency.",
      quote: "Putting simple trust in AI is not the answer, at least not yet.",
      status: "draft", url: "",
      links: [
        { to: "ramaswami", kind: "Argues with", why: "Ramaswami sees every planner gaining superpowers within a generation. Chu and Rouault quote Oklahoma City: “there’s no magic easy button.”" },
        { to: "samuels",   kind: "Agrees with", why: "Both warn that automating a broken process can make it worse." },
        { to: "heywood",   kind: "Agrees with", why: "Broad bans on government AI are unwise, says each piece; Heywood names the one New York has." }
      ] },
    { id: "ramaswami", section: "reboot", order: 3, at: [3, 8], label: "s",
      title: "Solving Big Problems with Big Data", short: "Big problems, big data", authors: ["Prem Ramaswami"],
      bio: "Prem Ramaswami is the head of Data Commons at Google. Previously, he served as president of urban technologies at Sidewalk Labs.",
      thesis: "City problems from housing to flooding are tangled networks that human minds can’t trace alone; AI can map them and test fixes before anyone pours concrete. That works only with privacy built in: faces and plates stripped at the sensor, signs on the street and the data published as a public asset.",
      quote: "Human minds alone cannot trace those cascading multidimensional effects manually. But human minds in collaboration with AI can.",
      status: "draft", url: "",
      links: [
        { to: "kontokosta", kind: "Argues with", why: "Ramaswami wants AI grounded in public data. Kontokosta warns that the data itself is skewed toward those who complain." },
        { to: "ratti",      kind: "Same ground", why: "Both want sensing in public space without identifying anyone." },
        { to: "chu",        kind: "Argues with", why: "Chu and Rouault are far more cautious about how fast AI will change city work." }
      ] },
    { id: "datastory", section: "reboot", order: 4, at: [6.25, 10], label: "e",
      title: "AI and the City: A Data Story", short: "By the numbers", authors: ["Vital City"],
      thesis: "New York is one of a few cities that publishes which algorithms its agencies use: 86 tools at 19 agencies in 2025, up from 31 at 11 in 2022, from child-welfare risk rankings to caption generators. The data story walks through the hard calls in policing, schools and the city workforce, then the wider economy: business adoption, young graduates’ unemployment, AI companies’ office leases and the Comptroller’s five budget scenarios.",
      quote: "The probabilities might sound like guesswork, and that’s because no one really knows what’s next.",
      status: "draft", url: "",
      links: [
        { to: "heywood", kind: "Same ground", why: "Both point to the LOADinG Act as the state law that limits how far the city can use AI on its own work." },
        { to: "reich",   kind: "Same ground", why: "The data story tracks the schools’ swings on AI, from the 2023 ChatGPT ban to this fall’s moratorium. Reich asks what the moratorium year should test." },
        { to: "giles",   kind: "Same ground", why: "Both tally AI companies’ growing footprint in Manhattan offices." }
      ] },
    { id: "masley", section: "reboot", order: 5, at: [1.5, 11], label: "e", status: "pending",
      title: "A New Urban Bargain on Data Centers", short: "Data centers", authors: ["Andy Masley"] },
    { id: "frazier", section: "reboot", order: 6, at: [5, 1.5], label: "n",
      title: "City Limits: Regulating AI Isn’t a Job for Locals", short: "City limits", authors: ["Kevin Frazier"],
      bio: "Kevin Frazier is AI Innovation and Law Fellow at Texas Law.",
      thesis: "Mayors shouldn’t try to regulate frontier AI. That belongs to Washington, and cities lack the legal authority and legitimacy for it. Frazier offers a test for what cities should take on: local problems, work that needs local partners and AI uses residents can see, measure and contest.",
      quote: "So mayors and city councilors, even those in large cities, should not set their sights on regulating the frontier of AI.",
      status: "draft", url: "",
      links: [
        { to: "washburn", kind: "Argues with", why: "Frazier keeps cities out of frontier AI. Washburn says the best model for governing it is a city invention." },
        { to: "samuels",  kind: "Agrees with", why: "Both read the Council’s frontier-risk hearing as a national question and point the city at its own services." },
        { to: "oren",     kind: "Same ground", why: "Frazier asks the city to show its work; Oren shows what that looks like for a court." }
      ] },
    { id: "washburn", section: "reboot", order: 7, at: [1.5, 1.5], label: "n",
      title: "What AI Can Learn from Zoning", short: "Zoning for AI", authors: ["Alexandros Washburn"],
      bio: "Alexandros Washburn is the founder of civicvirtue.ai and former chief urban designer of New York City.",
      thesis: "When the AI industry asked for rules, it asked for the equivalent of a building code for each model. New York’s 1916 Zoning Resolution offers the better lesson: govern what the swarm of agents does to the shared environment, the way setbacks protected light and air.",
      quote: "A city is literally an alignment machine, a machine for turning strangers into citizens.",
      status: "draft", url: "",
      links: [
        { to: "frazier", kind: "Argues with", why: "Frazier says frontier AI is for Washington; Washburn reaches for a tool cities built." },
        { to: "ratti",   kind: "Same ground", why: "Both draw on New York zoning history: the 1916 setbacks and the 1975 plaza rules." }
      ] },
    { id: "samuels", section: "reboot", order: 8, at: [1.5, 4.5], label: "s",
      title: "Deliverance from Bureaucratic Purgatory?", short: "The time tax", authors: ["Julie Samuels"],
      bio: "Julie Samuels is president and CEO of Tech:NYC.",
      thesis: "New Yorkers lose hours to hold music, repeat forms and dead-end websites, a time tax that falls hardest on those with the least slack. Samuels argues AI should work in the background, flagging missing documents and drafting repair tickets, and that the city should start with the processes poor residents use most.",
      quote: "AI can improve service, but when used carelessly, it can exacerbate the very pain points we are trying to eliminate.",
      status: "draft", url: "",
      links: [
        { to: "aggarwala", kind: "Same ground", why: "Samuels targets the time tax residents pay; Aggarwala targets the one inside government." },
        { to: "heywood",   kind: "Runs into",   why: "The background fixes Samuels proposes are the kind Heywood says state law could block." },
        { to: "schaeffer", kind: "Agrees with", why: "Both write from the nonprofit side: use AI to free staff for the human part of the job." }
      ] },
    { id: "giles", section: "reboot", order: 9, at: [5.5, 14.5], label: "n",
      title: "Lessons from Amazon HQ2", short: "An AI Fund", authors: ["Jared Giles"],
      bio: "Jared Giles is the founder of SquareOne and the author of The SQ1 Pivot, a weekly newsletter on data and civic policy. He is also the vice president of STEAM Engine.",
      thesis: "When Amazon walked away from HQ2 in 2019, it grew in New York anyway, and the city lost its leverage. Arlington, Virginia, kept leverage by paying incentives only as the company delivered. Giles wants New York to strike that kind of deal with AI companies, starting with an AI Fund, modeled on the JFK redevelopment’s community program, that pools their cash and equity for housing, children’s college accounts and displaced workers.",
      quote: "And because the answer is not coming from the federal government or any one corporation, it falls on cities to take care of their citizens.",
      status: "draft", url: "",
      links: [
        { to: "frazier",   kind: "Argues with", why: "Frazier leaves frontier AI to Washington. Giles says help won’t come from Washington, so cities have to bargain with the companies themselves." },
        { to: "goldsmith", kind: "Same ground", why: "Goldsmith wants a bargain with city workers; Giles wants one with AI companies." },
        { to: "gupta",     kind: "Agrees with", why: "Both say AI’s gains have to reach ordinary New Yorkers. Gupta would pay them out in time, Giles through a fund." }
      ] },
    { id: "sethi", section: "reboot", order: 10, at: [1.5, 14.5], label: "n",
      title: "Cities of Trust", short: "Cities of trust", authors: ["Brendan O’Flaherty", "Rajiv Sethi"],
      bio: "Brendan O’Flaherty is a professor of economics at Columbia University. Rajiv Sethi is a professor of economics at Barnard College, Columbia University and an external professor at the Santa Fe Institute.",
      thesis: "AI makes fakes cheap. Mayor Mamdani says relatives have sent him AI videos of himself, thinking they were real. O’Flaherty and Sethi argue that raises the demand for authentication and authenticity, and both make face-to-face dealings more valuable. Some cities will build their economies around trust: high finance and insurance run on a handshake ethic like JP Morgan’s, plus law, research, news and universities with honor codes.",
      quote: "Like the Puritan dream of Boston as a shining city on a hill, the great cities of the age of AI should be shining islands of integrity in a sea of sleaze, deception and fraud.",
      status: "draft", url: "",
      links: [
        { to: "chu",        kind: "Same ground", why: "Chu and Rouault ask residents to trust government AI; O’Flaherty and Sethi say AI will make trust scarce everywhere." },
        { to: "dellavolpe", kind: "Same ground", why: "Della Volpe says trust is won or lost in daily life; O’Flaherty and Sethi say whole city economies will be built on it." },
        { to: "giles",      kind: "Same ground", why: "Both ask how New York comes out ahead: Giles through a fund, O’Flaherty and Sethi through industries built on trust." }
      ] },

    /* ---------------- Retraining Our Systems ---------------- */
    { id: "goldsmith", section: "retrain", order: 1, at: [10, 4.5], label: "n",
      title: "The AI Bargain Cities Should Strike with Labor", short: "A bargain with labor", authors: ["Stephen Goldsmith"],
      bio: "Stephen Goldsmith is the Derek Bok Professor of the Practice of Urban Policy at Harvard Kennedy School, director of Data-Smart City Solutions at the Bloomberg Center for Cities at Harvard University, and former mayor of Indianapolis and deputy mayor of New York City.",
      thesis: "Facing more than $23 billion in projected budget gaps, the city could use AI to deliver better services for less, but union contracts and state law stand in the way. The former Indianapolis mayor proposes a bargain: no AI layoffs, training and a share of the gains for workers, with the workforce shrinking through attrition.",
      quote: "Blocking AI at the bargaining table will not permanently save jobs.",
      status: "draft", url: "",
      links: [
        { to: "heywood", kind: "Same goal, other route", why: "Both want AI in city agencies. Goldsmith would win labor over with a bargain; Heywood would rewrite the state law." },
        { to: "chu",     kind: "Argues with", why: "Goldsmith wants government right-sized over time; Chu and Rouault say augment and redirect the workforce." },
        { to: "gupta",   kind: "Same ground", why: "Goldsmith pays out AI’s gains in paychecks; Gupta pays them out in time." }
      ] },
    { id: "heywood", section: "retrain", order: 2, at: [13.5, 4.5], label: "sw",
      title: "Loosen These Legal Restrictions", short: "The LOADinG Act", authors: ["Rebecca Heywood"],
      bio: "Rebecca Heywood is the founder of Civic Works Studio and a former New York City civil servant.",
      thesis: "Albany’s LOADinG Act bars AI from taking over any duty a public employee performs now, and its key terms are undefined. Pennsylvania, California and Ohio protect workers while letting AI help; New York protects tasks, so its agencies will likely just avoid AI.",
      quote: "Only New York, it seems, is explicitly protecting the duties an employee is asked to perform, not the employee themselves.",
      status: "draft", url: "",
      links: [
        { to: "goldsmith", kind: "Same goal, other route", why: "Goldsmith would negotiate with the unions; Heywood would change the statute." },
        { to: "tang",      kind: "Same ground", why: "Tang wants DC37 at the table when the city picks its tools." },
        { to: "samuels",   kind: "Same ground", why: "Samuels’s time-tax fixes are the uses Heywood says a strict reading could bar." }
      ] },
    { id: "harvey", section: "retrain", order: 3, at: [15, 1.5], label: "n",
      title: "How’m I Really Doing? A New City Government Mantra", short: "How’m I really doing?", authors: ["Anna Harvey"],
      thesis: "Mayors need to know what their programs actually cause, but rigorous evaluation has meant years of data-sharing deals with outside researchers. AI working behind agency firewalls, guided by scientists, can now test programs and the city’s $32.4 billion in contracts quickly and cheaply.",
      quote: "Now, with the help of AI models (and a little help from the scientific community), mayors have a valuable new capacity to deliver improved government performance.",
      status: "draft", url: "",
      links: [
        { to: "kontokosta", kind: "Argues with", why: "Harvey trusts agencies’ own records for evaluation; Kontokosta warns those records reflect who shows up." },
        { to: "miller",     kind: "Same ground", why: "Both point to the Transportation Department’s street sensors as cheap measurement." },
        { to: "reich",      kind: "Agrees with", why: "Both want government to run real experiments and learn from them." }
      ] },
    { id: "kontokosta", section: "retrain", order: 4, at: [16.5, 3], label: "e",
      title: "If Data Are Biased, AI Will Only Amplify Problems", short: "Biased data in, bias out", authors: ["Constantine Kontokosta"],
      thesis: "AI optimizes toward a goal, but city data like 311 records who complains, not who needs help. Without expertise, attention to where the data comes from and accountable humans in charge, AI will steer services toward the already well served.",
      quote: "Artificial intelligence can help deliver better services, but not without recognizing and accounting for data bias and embedding fairness into a data-driven decision-making process.",
      status: "draft", url: "",
      links: [
        { to: "appel",      kind: "Argues with", why: "Appel would rank buildings for inspection using complaints and 311 calls; Kontokosta shows how that tilts service." },
        { to: "harvey",     kind: "Argues with", why: "Harvey’s evaluations lean on the same administrative records." },
        { to: "dellavolpe", kind: "Same ground", why: "Della Volpe’s long interviews reach the people 311 misses." }
      ] },
    { id: "turkcan", section: "retrain", order: 5, at: [9.5, 0.65], label: "e", status: "pending",
      title: "What Building Digital Twins Can Teach Us", short: "Digital twins", authors: ["Mehmet Turkcan"] },

    /* ---------------- Better Prompts, Better Services ---------------- */
    { id: "chohlaswood", section: "prompts", order: 1, at: [11.5, 10.5], label: "n",
      title: "AI to Advance Criminal Justice Reform", short: "Unstick justice reform", authors: ["Alex Chohlas-Wood"],
      bio: "Alex Chohlas-Wood is an assistant professor of computational social science at NYU Steinhardt, where he directs the Algorithms, Data, and Public Policy (ADAPPT) Lab, and the former director of analytics at the New York City Police Department. He provides paid consulting services for the NYPD’s Racial Disparities Review Committee.",
      thesis: "Many of New York’s justice reforms have stalled, often because the city struggles to act on its own digital information quickly or at scale. Chohlas-Wood proposes three uses for AI: reviewing body-camera footage to find unreported stops, helping 911 dispatchers and prosecutors divert more cases, and organizing digital evidence so cases move faster and fewer people wait on Rikers. To get there, the city has to win over a public wary of surveillance.",
      quote: "Today, AI is evolving so fast that we don’t have decades to spare.",
      status: "draft", url: "",
      links: [
        { to: "oren",      kind: "Same ground", why: "Both put AI to work on the justice system: Oren on court rulings, Chohlas-Wood on policing, prosecution and jail." },
        { to: "datastory", kind: "Same ground", why: "The data story lists the NYPD tools the city discloses. Chohlas-Wood says that disclosure law leaves out license plate readers." },
        { to: "harvey",    kind: "Agrees with", why: "Both want AI to measure what city programs actually do." }
      ] },
    { id: "reich", section: "prompts", order: 2, at: [13.5, 13.5], label: "w",
      title: "What a Better Public School AI Policy Would Look Like", short: "AI in the classroom", authors: ["Justin Reich"],
      bio: "Justin Reich is an associate professor of digital media at MIT and the host of “The Homework Machine” podcast.",
      thesis: "The city’s September school AI rules ban student-facing AI through eighth grade and tightly limit it in high school, a response to politics more than evidence. Reich would give older students more room and says the policy’s best feature is its promise to treat the year as an experiment and publish what it learns.",
      quote: "New York City’s new policy on AI in schools is based on politics, not science.",
      status: "published", url: "https://www.vitalcitynyc.org/nyc-public-school-classroom-ai-policy/",
      links: [
        { to: "harvey",  kind: "Agrees with", why: "Both want the city to test, measure and publish." },
        { to: "frazier", kind: "Same ground", why: "Frazier’s test for local AI is whether residents can see, measure and contest it. Reich asks that of the schools." }
      ] },
    { id: "appel", section: "prompts", order: 3, at: [20.5, 10.5], label: "ne",
      title: "AI to Improve Quality of Life", short: "Quality of life", authors: ["Josh Appel"],
      bio: "Josh Appel is a policy analyst at the Manhattan Institute.",
      thesis: "New Yorkers rate city services worse than they did in 2017, even though the city taxes and spends near the top of the nation. AI can read the records the city already keeps and predict where problems will appear, doing for city services what CompStat did for crime.",
      quote: "City government does not need to collect an entirely new universe of information.",
      status: "draft", url: "",
      links: [
        { to: "kontokosta", kind: "Argues with", why: "Kontokosta warns that the complaint data Appel would feed the models sends service to the well served." },
        { to: "harvey",     kind: "Same ground", why: "Both want the city to mine its own records to find what works." },
        { to: "ramaswami",  kind: "Agrees with", why: "Both see open data as the raw material." }
      ] },
    { id: "miller", section: "prompts", order: 4, at: [13.5, 10.5], label: "se",
      title: "AI to Advance Vision Zero", short: "Vision Zero", authors: ["Andrew Miller"],
      bio: "Andrew Miller writes Changing Lanes, a newsletter on mobility innovation, and is co-author of “The End of Driving.”",
      thesis: "The mayor says he’ll judge Vision Zero by how people behave on the streets, but his plan concedes the city can’t measure that, and it never mentions AI. Computer-vision sensors already on city streets could count near-misses, guide the new Office of Curb Management and back camera enforcement, with privacy limits written in.",
      quote: "To make that judgment, the City needs to actually be able to measure the behavior of those who use the streets.",
      status: "draft", url: "",
      links: [
        { to: "ratti",  kind: "Same ground", why: "Both want cameras that count what happens in public space without identifying anyone." },
        { to: "harvey", kind: "Same ground", why: "Harvey cites the same street-sensor program as a cheap way to measure." }
      ] },
    { id: "oren", section: "prompts", order: 5, at: [9.5, 12], label: "n",
      title: "AI to Enhance Transparency and Accountability", short: "Courts in plain language", authors: ["Oded Oren"],
      bio: "Oded Oren is the founder and executive director of Scrutinize, a nonprofit that uses data and AI to increase the transparency and accountability of state courts. He spent seven years as a public defender in the Bronx.",
      thesis: "Court decisions are public, but understanding them takes expertise few people have, so the state’s highest court gets little scrutiny. Scrutinize used chains of AI prompts, each checked repeatedly, to turn every Court of Appeals decision since Judge Jenny Rivera joined into plain language anyone can compare.",
      quote: "Our work demonstrates how large language models can change the economics of producing public knowledge from public records.",
      status: "draft", url: "",
      links: [
        { to: "chu",     kind: "Same ground", why: "Boston did the same for 19 years of City Council votes." },
        { to: "frazier", kind: "Same ground", why: "Frazier wants residents able to see and contest how government uses AI." }
      ] },
    { id: "dellavolpe", section: "prompts", order: 6, at: [16.5, 13.5], label: "se",
      title: "AI to Hear Constituent Concerns", short: "AI that listens", authors: ["John Della Volpe"],
      bio: "John Della Volpe is director of polling at the Harvard Kennedy School Institute of Politics. His company conducts research for Vital City, and he holds a significant financial stake in CrowdVox AI, the platform used for the interviews in his piece.",
      thesis: "Cities measure themselves in jobs and on-time rates, while residents judge them by daily life. AI interviewers that hold long, recurring conversations with thousands of New Yorkers can capture both the number and the story, but listening builds trust only if the city visibly acts on what it hears.",
      quote: "Closing the loop doesn’t mean granting every request. It means showing New Yorkers that the City heard them as people, not just as data points.",
      status: "draft", url: "",
      links: [
        { to: "tang",       kind: "Agrees with", why: "Both want the city to listen at scale and then close the loop." },
        { to: "kontokosta", kind: "Same ground", why: "Both show what 311 tickets miss about people’s lives." },
        { to: "ramosruiz",  kind: "Same ground", why: "Ramos-Ruiz wants the listening to connect residents to one another too." }
      ] },
    { id: "tang", section: "prompts", order: 7, at: [16.5, 7.5], label: "ne",
      title: "AI to Amplify Civic Participation", short: "Case numbers for all", authors: ["Audrey Tang"],
      bio: "Audrey Tang is Taiwan’s cyber ambassador and its first digital minister.",
      thesis: "When she called 311 about her ID card application, there was no category, no case number and a one-way reply within 14 business days. Tang says city AI should route every request to the worker who can solve it and help the city listen at scale, not replace the people who do the work.",
      quote: "None of this replaces city workers; it puts residents in front of them.",
      status: "draft", url: "",
      links: [

<script>
(() => {
const SVGNS = 'http://www.w3.org/2000/svg';
const U = 52;            // px per grid unit
const LANE = 7.5;        // spacing between parallel lines
const LW = 6.5;          // line width
const R = 8.5;           // station inner radius
const PAD = 70;

const byId = Object.fromEntries(ISSUE.pieces.map(p => [p.id, p]));
const lineById = Object.fromEntries(ISSUE.lines.map(l => [l.id, l]));
const secById = Object.fromEntries(ISSUE.sections.map(s => [s.id, s]));
// lines each piece rides, in line order, with that piece's take
ISSUE.pieces.forEach(p => p.rides = []);
ISSUE.lines.forEach(l => l.stops.forEach(s => {
  if (!byId[s.p]) { console.warn('Line', l.id, 'has unknown stop', s.p); return; }
  byId[s.p].rides.push({ line: l, take: s.take });
}));

const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const h = (tag, attrs = {}, html) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'style') n.style.cssText = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if (html !== undefined) n.innerHTML = html;
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const authorsText = p => {
  const a = p.authors;
  return a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
};
const bulletHTML = (l, sm) => `<span class="bullet${sm ? ' sm' : ''}${l.planned ? ' planned' : ''}" style="background:${l.color}" aria-hidden="true">${esc(l.letter)}</span>`;

/* ---------- Header copy ---------- */
document.getElementById('title').textContent = ISSUE.title;
document.getElementById('dek').textContent = ISSUE.dek;
const onMap = ISSUE.pieces.filter(p => !p.offMap);
const live = onMap.filter(p => p.status !== 'pending').length;
document.getElementById('howto').innerHTML = ISSUE.howto
  .replace('{lines}', ISSUE.lines.length)
  .replace('{pieces}', onMap.length)
  .replace('{live}', live);
document.getElementById('foot').innerHTML = ISSUE.footnote;
document.getElementById('toc-sub').textContent = ISSUE.tocNote;

/* ---------- Geometry ---------- */
const P = id => [byId[id].at[0] * U, byId[id].at[1] * U];

function octi(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], ax = Math.abs(dx), ay = Math.abs(dy);
  if (ax < .01 || ay < .01 || Math.abs(ax - ay) < .01) return [a, b];
  const sx = Math.sign(dx), sy = Math.sign(dy);
  if (ax > ay) {
    const run = (ax - ay) / 2, p1 = [a[0] + sx * run, a[1]], p2 = [p1[0] + sx * ay, b[1]];
    return [a, p1, p2, b];
  }
  const run = (ay - ax) / 2, p1 = [a[0], a[1] + sy * run], p2 = [b[0], p1[1] + sy * ax];
  return [a, p1, p2, b];
}

// Expand each line into a polyline; remember which vertices are stations.
ISSUE.lines.forEach(l => {
  const pts = [], stationAt = [];
  const ids = l.stops.map(s => s.p).filter(id => byId[id]);
  ids.forEach((id, i) => {
    if (i === 0) { pts.push(P(id)); stationAt.push(id); return; }
    const prev = ids[i - 1];
    const via = ((l.via || {})[prev + '>' + id] || []).map(v => [v[0] * U, v[1] * U]);
    const way = [P(prev), ...via, P(id)];
    for (let k = 0; k < way.length - 1; k++) {
      const seg = octi(way[k], way[k + 1]);
      seg.slice(1).forEach((q, j) => {
        pts.push(q);
        stationAt.push(k === way.length - 2 && j === seg.length - 2 ? id : null);
      });
    }
  });
  l._pts = pts; l._st = stationAt;
});

// Shared sub-segments get parallel lanes.
const keyPt = p => Math.round(p[0]) + ',' + Math.round(p[1]);
const segKey = (a, b) => { const ka = keyPt(a), kb = keyPt(b); return ka < kb ? ka + '|' + kb : kb + '|' + ka; };
const groups = new Map();
ISSUE.lines.forEach((l, li) => {
  for (let k = 0; k < l._pts.length - 1; k++) {
    const key = segKey(l._pts[k], l._pts[k + 1]);
    if (!groups.has(key)) groups.set(key, []);
    const g = groups.get(key);
    if (!g.includes(li)) g.push(li);
  }
});
// Lines whose lane order should be fixed regardless of draw order can set `lane` (lower = left/top)
groups.forEach(g => g.sort((a, b) => (ISSUE.lines[a].lane ?? a) - (ISSUE.lines[b].lane ?? b)));

function canonNormal(a, b) {
  const ka = keyPt(a), kb = keyPt(b);
  const [p, q] = ka < kb ? [a, b] : [b, a];
  const dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1;
  return [-dy / len, dx / len];
}
function intersect(p1, p2, p3, p4) {
  const d = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0]);
  if (Math.abs(d) < 1e-6) return null;
  const t = ((p1[0] - p3[0]) * (p3[1] - p4[1]) - (p1[1] - p3[1]) * (p3[0] - p4[0])) / d;
  return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
}

const stationPts = {}; // id -> offset points of every line passing through
ISSUE.lines.forEach((l, li) => {
  const pts = l._pts, n = pts.length, segs = [];
  for (let k = 0; k < n - 1; k++) {
    const g = groups.get(segKey(pts[k], pts[k + 1]));
    const o = (g.indexOf(li) - (g.length - 1) / 2) * LANE;
    const nm = canonNormal(pts[k], pts[k + 1]);
    segs.push({ a: [pts[k][0] + nm[0] * o, pts[k][1] + nm[1] * o], b: [pts[k + 1][0] + nm[0] * o, pts[k + 1][1] + nm[1] * o] });
  }
  const out = [], vmap = []; // vmap[k] = indices in out that belong to vertex k
  const push = (p, k) => { out.push(p); (vmap[k] = vmap[k] || []).push(out.length - 1); };
  push(segs[0].a, 0);
  for (let k = 1; k < n - 1; k++) {
    const s1 = segs[k - 1], s2 = segs[k];
    const x = intersect(s1.a, s1.b, s2.a, s2.b);
    if (x && Math.hypot(x[0] - pts[k][0], x[1] - pts[k][1]) < LANE * 4) push(x, k);
    else { push(s1.b, k); if (Math.hypot(s1.b[0] - s2.a[0], s1.b[1] - s2.a[1]) > .5) push(s2.a, k); }
  }
  push(segs[n - 2].b, n - 1);
  l._out = out;
  l._st.forEach((id, k) => { if (id) (stationPts[id] = stationPts[id] || []).push(...vmap[k].map(i => out[i])); });
});

function roundedPath(pts, r) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i - 1], c = pts[i], q = pts[i + 1];
    const l1 = Math.hypot(c[0] - p[0], c[1] - p[1]), l2 = Math.hypot(q[0] - c[0], q[1] - c[1]);
    if (l1 < .5 || l2 < .5) { d += ` L${c[0].toFixed(1)},${c[1].toFixed(1)}`; continue; }
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const a = [c[0] - (c[0] - p[0]) / l1 * rr, c[1] - (c[1] - p[1]) / l1 * rr];
    const b = [c[0] + (q[0] - c[0]) / l2 * rr, c[1] + (q[1] - c[1]) / l2 * rr];
    d += ` L${a[0].toFixed(1)},${a[1].toFixed(1)} Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
  }
  const z = pts[pts.length - 1];
  return d + ` L${z[0].toFixed(1)},${z[1].toFixed(1)}`;
}

/* ---------- Draw ---------- */
const svg = document.getElementById('map');
let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
const grow = (x, y) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); };
ISSUE.sections.forEach(s => { const [x, y, w, hh] = s.area; grow(x * U, y * U); grow((x + w) * U, (y + hh) * U); });
ISSUE.pieces.forEach(p => p.at && grow(p.at[0] * U, p.at[1] * U));
const vb = [minX - PAD * .3, minY - PAD * .3, maxX - minX + PAD * .6, maxY - minY + PAD * .6];
svg.setAttribute('viewBox', vb.map(v => v.toFixed(0)).join(' '));
el('rect', { x: vb[0], y: vb[1], width: vb[2], height: vb[3], fill: 'var(--map)' }, svg);

const gDist = el('g', {}, svg);
ISSUE.sections.forEach(s => {
  const [x, y, w, hh] = s.area;
  el('rect', { x: x * U, y: y * U, width: w * U, height: hh * U, fill: 'var(--district)' }, gDist);
  const [lx, ly, anchor] = s.labelAt || [x + .35, y + .75, 'start'];
  const tx = el('text', { x: lx * U, y: ly * U, class: 'district-label', 'text-anchor': anchor || 'start' }, gDist);
  tx.textContent = s.name;
});

const gLines = el('g', {}, svg);
ISSUE.lines.forEach(l => {
  const g = el('g', { class: 'line', 'data-line': l.id }, gLines);
  const d = roundedPath(l._out, 22);
  const ink = el('path', { d, class: 'ink', stroke: l.color, 'stroke-width': LW }, g);
  if (l.planned) ink.setAttribute('stroke-dasharray', '11 8');
  const hit = el('path', { d, class: 'hit' }, g);
  const t = el('title', {}, hit); t.textContent = `${l.letter}: ${l.name}`;
  hit.addEventListener('click', () => go('line', l.id));
  l._g = g;
});

const gSt = el('g', {}, svg);
const LABEL = { e: [1, 0, 'start'], w: [-1, 0, 'end'], n: [0, -1, 'middle'], s: [0, 1, 'middle'], ne: [.75, -.75, 'start'], nw: [-.75, -.75, 'end'], se: [.75, .75, 'start'], sw: [-.75, .75, 'end'] };
ISSUE.pieces.forEach(p => {
  if (p.offMap) return; // e.g. the editors’ note: listed in the contents, not drawn as a stop
  const c = P(p.id);
  const pts = stationPts[p.id] || [c];
  // farthest pair defines the capsule
  let A = pts[0], B = pts[0], best = 0;
  for (const a of pts) for (const b of pts) { const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (d > best) { best = d; A = a; B = b; } }
  const cx = (A[0] + B[0]) / 2, cy = (A[1] + B[1]) / 2;
  const g = el('g', { class: 'station' + (p.status === 'pending' ? ' pending' : ''), 'data-piece': p.id, tabindex: 0, role: 'button', 'aria-label': `${p.title}, by ${authorsText(p)}` }, gSt);
  const pending = p.status === 'pending';
  const mk = (stroke, width) => el('path', { d: `M${A[0]},${A[1]} L${B[0]},${B[1]}`, stroke, 'stroke-width': width, 'stroke-linecap': 'round', fill: 'none' }, g);
  if (pending) {
    mk('#6f6f76', R * 2 + 5);
    mk('var(--map)', R * 2 - 1);
  } else {
    mk('var(--map)', R * 2 + 7);
    mk('#fff', R * 2);
  }
  const ring = el('path', { class: 'halo', d: `M${A[0]},${A[1]} L${B[0]},${B[1]}` }, g);
  ring.setAttribute('style', `stroke-linecap:round;stroke-width:${R * 2 + 12}px;fill:none;stroke-opacity:0`);
  el('circle', { cx, cy, r: 26, fill: 'transparent' }, g);
  const [ux, uy, anchor] = LABEL[p.label || 'e'];
  const half = best / 2;
  const off = R + 12 + half * (Math.abs(ux * (B[0] - A[0]) + uy * (B[1] - A[1])) / (best || 1));
  let lx = cx + ux * off, ly = cy + uy * off;
  // full names; a second author gets a line of their own
  const names = p.authors.length > 1 ? [...p.authors.slice(0, -2), p.authors.slice(-2)[0] + ' and', p.authors.slice(-1)[0]] : p.authors;
  const lines = [...names.map(t => [t, 'nm']), [p.short, 'sh']].filter(x => x[0]);
  const lh = 17, n = lines.length;
  if (uy === 0) ly -= (n - 1) * lh / 2 - 5; // centre the block on the station
  else if (uy < 0) ly -= (n - 1) * lh + 2;  // stack above
  else ly += 12;                            // stack below
  if (p.labelNudge) { lx += p.labelNudge[0]; ly += p.labelNudge[1]; }
  const tx = el('text', { x: lx, y: ly, 'text-anchor': anchor }, g);
  lines.forEach(([t, cls], i) => {
    const ts = el('tspan', { x: lx, dy: i ? lh : 0, class: cls }, tx);
    ts.textContent = t;
  });
  g.addEventListener('click', () => go('piece', p.id));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go('piece', p.id); } });
  g.addEventListener('mouseenter', () => hover(p.id));
  g.addEventListener('mouseleave', () => hover(null));
  p._g = g;
});

/* ---------- Line buttons ---------- */
const lb = document.getElementById('linebtns');
ISSUE.lines.forEach(l => {
  const li = h('li');
  const b = h('button', { class: 'linebtn', type: 'button', 'aria-pressed': 'false', 'data-line': l.id },
    `${bulletHTML(l)}<span>${esc(l.name)}<span class="q">${esc(l.question)}</span></span>`);
  b.addEventListener('click', () => state.kind === 'line' && state.id === l.id ? close() : go('line', l.id));
  li.appendChild(b); lb.appendChild(li); l._btn = b;
});

/* ---------- Table of contents ---------- */
const secWrap = document.getElementById('sections');
ISSUE.sections.forEach(s => {
  const box = h('div', { class: 'sec' });
  box.appendChild(h('h3', {}, esc(s.name)));
  const ol = h('ol');
  ISSUE.pieces.filter(p => p.section === s.id).sort((a, b) => a.order - b.order).forEach(p => {
    const li = h('li');
    const tag = p.offMap ? `<span class="tag">${esc(p.short)}</span>` : p.status === 'pending' ? '<span class="tag">In the works</span>' : p.status === 'published' ? '<span class="tag" style="color:#000">Published</span>' : '';
    const b = h('button', { class: 'tocbtn' + (p.status === 'pending' ? ' pending' : ''), type: 'button' },
      `<span class="t">${esc(p.title)}${tag}</span><span class="a">${esc(authorsText(p))}</span><span class="bl">${p.rides.map(r => bulletHTML(r.line, true)).join('')}</span>`);
    b.addEventListener('click', () => go('piece', p.id));
    li.appendChild(b); ol.appendChild(li);
  });
  box.appendChild(ol); secWrap.appendChild(box);
});

/* ---------- State, focus, panel ---------- */
const state = { kind: null, id: null };
const panel = document.getElementById('panel'), pbody = document.getElementById('pbody'), crumb = document.getElementById('crumb');
let lastFocus = null;

function setFocus(lineIds, pieceIds) {
  const on = !!(lineIds || pieceIds);
  svg.classList.toggle('focus', on);
  ISSUE.lines.forEach(l => l._g.classList.toggle('on', !!lineIds && lineIds.includes(l.id)));
  ISSUE.pieces.forEach(p => p._g && p._g.classList.toggle('on', !!pieceIds && pieceIds.includes(p.id)));
}
function applyState() {
  if (state.kind === 'line') {
    const l = lineById[state.id];
    setFocus([l.id], l.stops.map(s => s.p));
  } else if (state.kind === 'piece') {
    const p = byId[state.id];
    const ls = p.rides.map(r => r.line.id);
    const ps = new Set([p.id, ...(p.links || []).map(x => x.to)]);
    p.rides.forEach(r => r.line.stops.forEach(s => ps.add(s.p)));
    setFocus(ls.length ? ls : [], [...ps]);
  } else setFocus(null, null);
  ISSUE.lines.forEach(l => l._btn.setAttribute('aria-pressed', String(state.kind === 'line' && state.id === l.id)));
}
function hover(id) {
  if (state.kind) return;
  if (!id) return setFocus(null, null);
  const p = byId[id];
  setFocus(p.rides.map(r => r.line.id), [p.id]);
}

// In an embed the frame is as tall as the page, so a fixed panel would open off-screen.
// Instead it opens beside whatever was tapped, and the host story scrolls to it if needed.
const EMBED = document.body.classList.contains('embed');
let tap = null;
document.addEventListener('click', e => { tap = { y: e.pageY, inPanel: panel.contains(e.target) }; }, true);
function placePanel() {
  const wasOpen = document.body.classList.contains('panel-open');
  if (wasOpen && tap && tap.inPanel) { tap = null; return; }
  let y = tap ? tap.y : null;
  if (y == null) {
    const a = document.activeElement;
    y = a && a !== document.body ? a.getBoundingClientRect().top + scrollY : document.querySelector('.mapcard').offsetTop;
  }
  const ph = panel.offsetHeight, wrapH = document.querySelector('.wrap').offsetHeight;
  const top = Math.max(0, Math.min(y - 140, wrapH - ph));
  panel.style.top = top + 'px';
  parent.postMessage({ type: 'vc-embed-scroll', id: 'ai-and-the-city-map', top, height: ph }, '*');
  tap = null;
}

function go(kind, id, fromHash) {
  state.kind = kind; state.id = id;
  if (!panel.contains(document.activeElement)) lastFocus = document.activeElement;
  kind === 'line' ? renderLine(lineById[id]) : renderPiece(byId[id]);
  if (EMBED) placePanel();
  document.body.classList.add('panel-open');
  panel.setAttribute('aria-hidden', 'false');
  pbody.scrollTop = 0;
  applyState();
  if (!fromHash) history.replaceState(null, '', '#' + kind + '-' + id);
  if (!fromHash) document.getElementById('closebtn').focus({ preventScroll: true });
}
function close() {
  state.kind = state.id = null;
  document.body.classList.remove('panel-open');
  panel.setAttribute('aria-hidden', 'true');
  applyState();
  history.replaceState(null, '', location.pathname + location.search);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
document.getElementById('closebtn').addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.kind) close(); });

function renderPiece(p) {
  const sec = secById[p.section];
  const accent = p.rides[0] ? p.rides[0].line.color : 'var(--vc-orange)';
  crumb.textContent = sec.name;
  let html = `<h2 class="p-title">${esc(p.title)}</h2>
    <p class="p-by">By <b>${esc(authorsText(p))}</b></p>`;
  if (p.bio) html += `<p class="p-bio">${esc(p.bio)}</p>`;
  if (p.status === 'pending') {
    html += `<p class="pend">${esc(p.pendingNote || 'This piece is still in the works. It joins the map when the draft comes in.')}</p>`;
  } else {
    if (p.thesis) html += `<p class="p-thesis">${esc(p.thesis)}</p>`;
    if (p.quote) html += `<blockquote class="p-quote" style="--accent:${accent}">“${esc(p.quote)}”<cite>${esc(authorsText(p))}</cite></blockquote>`;
  }
  html += p.url
    ? `<a class="cta" href="${esc(p.url)}" target="_blank" rel="noopener">Read the piece</a>`
    : `<span class="cta off" aria-disabled="true">${p.status === 'pending' ? 'Coming in this issue' : 'Link goes live when the piece publishes'}</span>`;
  if (p.rides.length) {
    html += `<h3 class="p-h">Lines this piece rides</h3><ul class="rides">` + p.rides.map(r =>
      `<li><button class="ridebtn" type="button" data-go-line="${r.line.id}">${bulletHTML(r.line)}<span class="ln">${esc(r.line.name)}</span><span class="tk">${esc(r.take)}</span></button></li>`).join('') + '</ul>';
  }
  if (p.links && p.links.length) {
    html += `<h3 class="p-h">Transfer to</h3><ul class="xfers">` + p.links.filter(x => byId[x.to]).map(x => {
      const q = byId[x.to];
      return `<li><button class="xbtn" type="button" data-go-piece="${q.id}"><span class="k">${esc(x.kind)}</span><span class="who">${esc(authorsText(q))}: ${esc(q.title)}</span><span class="why">${esc(x.why)}</span></button></li>`;
    }).join('') + '</ul>';
  }
  pbody.innerHTML = html;
  wirePanel();
}

function renderLine(l) {
  crumb.textContent = 'Ride the ' + l.letter + ' line';
  let html = `<div class="l-head">${bulletHTML(l)}<h2 class="l-name">${esc(l.name)}</h2></div>
    <p class="l-q">${esc(l.question)}</p>
    <p class="l-sum">${esc(l.summary)}</p>
    <h3 class="p-h">Stops, in order</h3>
    <ol class="strip" style="--lc:${l.color}">` + l.stops.filter(s => byId[s.p]).map(s => {
      const p = byId[s.p];
      const others = p.rides.filter(r => r.line.id !== l.id).map(r => bulletHTML(r.line, true)).join('');
      return `<li><span class="dot"></span><button class="stopbtn" type="button" data-go-piece="${p.id}">
        <span class="who">${esc(authorsText(p))}${others ? `<span class="xbul" title="Transfers">${others}</span>` : ''}</span>
        <span class="ttl">${esc(p.title)}</span>
        <span class="tk">${esc(s.take)}</span></button></li>`;
    }).join('') + '</ol>';
  pbody.innerHTML = html;
  wirePanel();
}
function wirePanel() {
  pbody.querySelectorAll('[data-go-line]').forEach(b => b.addEventListener('click', () => go('line', b.dataset.goLine)));
  pbody.querySelectorAll('[data-go-piece]').forEach(b => b.addEventListener('click', () => go('piece', b.dataset.goPiece)));
}

function fromHash() {
  const m = location.hash.match(/^#(line|piece)[-=]([a-z]+)$/);
  if (m && (m[1] === 'line' ? lineById[m[2]] : byId[m[2]])) go(m[1], m[2], true);
}
window.addEventListener('hashchange', fromHash);
fromHash();
})();
</script>
</body>
</html>
